name: Assemble FinClose v0.20 runtime

on:
  push:
    branches:
      - finclose-v020-runtime
    paths:
      - 'finclose_runtime/v0.20.0/payload_*.txt'
      - '.github/workflows/finclose-runtime-assemble.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: finclose-v020-runtime
          fetch-depth: 0

      - name: Diagnose, assemble and unpack runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import io
          import json
          import lzma
          import shutil
          import tarfile
          import zipfile
          from pathlib import Path

          root = Path('finclose_runtime/v0.20.0')
          parts = sorted(root.glob('payload_*.txt'))
          if not parts:
              raise SystemExit('No FinClose payload chunks found')

          # Decode each staged Base64 chunk independently. All non-final chunks were
          # intentionally written on 4-character boundaries, so this also tells us
          # exactly which staged part first corrupts the XZ stream.
          compressed_parts: list[bytes] = []
          for p in parts:
              raw = p.read_text(encoding='utf-8').strip().encode('ascii')
              try:
                  decoded = base64.b64decode(raw, validate=True)
              except Exception as exc:
                  raise SystemExit(f'BASE64_CORRUPTION part={p.name} chars={len(raw)} error={exc}') from exc
              compressed_parts.append(decoded)
              print(f'PART {p.name}: encoded={len(raw)} decoded={len(decoded)} sha256={hashlib.sha256(decoded).hexdigest()}')

          decompressor = lzma.LZMADecompressor(format=lzma.FORMAT_AUTO)
          output_parts: list[bytes] = []
          for index, (p, chunk) in enumerate(zip(parts, compressed_parts)):
              try:
                  produced = decompressor.decompress(chunk)
                  output_parts.append(produced)
                  print(
                      f'XZ FEED {p.name}: compressed={len(chunk)} produced={len(produced)} '
                      f'eof={decompressor.eof} unused={len(decompressor.unused_data)}'
                  )
              except lzma.LZMAError as exc:
                  previous = parts[index - 1].name if index else 'none'
                  raise SystemExit(
                      f'XZ_CORRUPTION first_detected_in={p.name} previous_part={previous} '
                      f'compressed_offset={sum(len(x) for x in compressed_parts[:index])} error={exc}'
                  ) from exc

          if not decompressor.eof:
              raise SystemExit(
                  f'XZ_TRUNCATED after={parts[-1].name} compressed_bytes={sum(map(len, compressed_parts))}; '
                  'the staged payload is missing tail bytes or its final chunk is incomplete'
              )

          compressed = b''.join(compressed_parts)
          decompressed = b''.join(output_parts)

          # Cross-check the streaming result against a one-shot decode before writing files.
          verified = lzma.decompress(compressed)
          if verified != decompressed:
              raise SystemExit('XZ_VERIFY_MISMATCH streaming and one-shot outputs differ')

          out = root / 'assembled'
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)

          def safe_target(base: Path, member: str) -> Path:
              target = (base / member).resolve()
              base_resolved = base.resolve()
              if target != base_resolved and base_resolved not in target.parents:
                  raise RuntimeError(f'Unsafe archive member: {member}')
              return target

          archive_type = 'binary'
          if zipfile.is_zipfile(io.BytesIO(decompressed)):
              archive_type = 'zip'
              with zipfile.ZipFile(io.BytesIO(decompressed)) as zf:
                  for info in zf.infolist():
                      safe_target(out, info.filename)
                  zf.extractall(out)
          else:
              tmp = root / '.runtime-decoded.tmp'
              tmp.write_bytes(decompressed)
              try:
                  if tarfile.is_tarfile(tmp):
                      archive_type = 'tar'
                      with tarfile.open(tmp) as tf:
                          for member in tf.getmembers():
                              safe_target(out, member.name)
                          tf.extractall(out)
                  else:
                      (out / 'runtime.bin').write_bytes(decompressed)
              finally:
                  tmp.unlink(missing_ok=True)

          files = []
          for p in sorted(x for x in out.rglob('*') if x.is_file()):
              data = p.read_bytes()
              files.append({
                  'path': p.relative_to(out).as_posix(),
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })

          manifest = {
              'payload_chunks': [p.name for p in parts],
              'payload_count': len(parts),
              'encoded_bytes': sum(len(p.read_text(encoding='utf-8').strip()) for p in parts),
              'compressed_bytes': len(compressed),
              'compressed_sha256': hashlib.sha256(compressed).hexdigest(),
              'decompressed_bytes': len(decompressed),
              'decompressed_sha256': hashlib.sha256(decompressed).hexdigest(),
              'archive_type': archive_type,
              'files': files,
          }
          (root / 'assembly-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Commit assembled runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add finclose_runtime/v0.20.0/assembled finclose_runtime/v0.20.0/assembly-manifest.json
          if git diff --cached --quiet; then
            echo 'No assembly changes to commit.'
            exit 0
          fi
          git commit -m 'FinClose v0.20: materialize verified Vercel runtime package'
          git push origin HEAD:finclose-v020-runtime
